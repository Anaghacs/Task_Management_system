<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Home Page</title>
	<style type="text/css">
		*{
			text-decoration: none;
		}
		.navbar{
			background: rgb(232, 217, 222); font-family: calibri; padding-right: 15px;padding-left: 15px;
		}
		.navdiv{
			display: flex; align-items: center; justify-content: space-between;
		}
		.logo a{
			font-size: 35px; font-weight: 600; color: white;
		}
		li{
			list-style: none; display: inline-block;
		}
		li a{
			color: white; font-size: 18px; font-weight: bold; margin-right: 25px;
		}
		button{
			background-color: black; margin-left: 10px; border-radius: 10px; padding: 10px; width: 90px;
		}
		button a{
			color: white; font-weight: bold; font-size: 15px;
		}
	</style>
</head>
<body>
	<nav class="navbar">
		<div class="navdiv">
			<div class="logo"><a href="#">Welcome<span style="color: brown;">'{{ request.user.username }}'</span></a></div>
			<ul>
                <li><a href="{% url 'add_admin' %}">Add Admins</a></li>
				<li><a href="{% url 'view_admins' %}">View Admins</a></li>
                <li><a href="{% url 'add_users' %}">Add Users</a></li>
				<li><a href="{% url 'view_users' %}">View Users</a></li>
				<li><a href="#">View Task</a></li>
                <li><a href="{% url 'logout' %}">LogOut</a></li>
			</ul>
		</div>
	</nav>
</body>
</html>
